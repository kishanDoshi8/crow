# Security headers for the Verdict web app.
#
# Installed as /etc/nginx/snippets/security-headers.conf and included by every
# location in sites-available/kishandoshi.me (see the note there on why each
# location includes it again). "always" adds them to error responses too.

# Browsers only use HTTPS for this domain for the next year, even if someone
# types http://. Only this domain: subdomains aren't covered.
add_header Strict-Transport-Security "max-age=31536000" always;

# Don't guess file types: a file is only run as a script if it's labelled one.
add_header X-Content-Type-Options "nosniff" always;

# Other sites see only "kishandoshi.me" as the referrer, never the full URL
# with room codes in it.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# No other site can show the app inside a frame (clickjacking).
add_header X-Frame-Options "DENY" always;

# The app doesn't use these, so nothing running on the page can ask for them.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
