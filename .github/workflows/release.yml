name: Release

# Pushing a version tag (e.g. `git tag -a v0.5.0 -m "v0.5.0" && git push origin v0.5.0`)
# checks the tag, runs CI, builds that exact tag here on GitHub, uploads it to
# the server as a new release folder, switches the site to it and creates a
# GitHub Release. "Run workflow" in the Actions tab redeploys any existing tag,
# which is also how you roll back. Server setup: docs/server-setup.md.
#
# Database migrations are NOT applied here: run them by hand before tagging,
# and keep each migration working with the previous frontend.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to deploy (e.g. v0.4.2)
        required: true

permissions:
  contents: read

# One deploy at a time; a second one waits instead of cancelling the first.
concurrency:
  group: production
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is a version on master
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' isn't a version tag like v0.5.0 or v0.5.0-rc.1"
            exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null \
            || { echo "::error::Tag $TAG doesn't exist"; exit 1; }
          git merge-base --is-ancestor "$TAG^{commit}" origin/master \
            || { echo "::error::$TAG isn't on master. Tag a commit that has been merged."; exit 1; }

  # Same checks as pull requests. Skipped when redeploying an existing tag:
  # it already passed when it was first released.
  ci:
    name: CI
    needs: verify
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  # Builds the tagged commit on GitHub's runner (the 1 GB droplet runs out of
  # memory building it) and keeps the result as a downloadable artifact.
  build:
    name: Build
    needs: [verify, ci]
    if: ${{ !cancelled() && needs.verify.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.ci.result) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          # Full history and tags, so the build ID reads "v0.5.0" (git describe).
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # VITE_* values end up inside the public JavaScript bundle, so they're
      # repository variables (Settings > Secrets and variables > Actions >
      # Variables), not secrets.
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WEB_PUSH_PUBLIC_KEY: ${{ vars.VITE_WEB_PUSH_PUBLIC_KEY }}
          VITE_SHORT_INVITE_LINKS: ${{ vars.VITE_SHORT_INVITE_LINKS }}
        run: |
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set"
              exit 1
            fi
          done
          npm run build

      - name: Check the build is the tag
        run: |
          release=$(jq -r .release apps/web/dist/version.json)
          if [ "$release" != "$TAG" ]; then
            echo "::error::Build reports '$release', expected '$TAG'"
            exit 1
          fi

      # nginx serves these .gz files directly (gzip_static), so the droplet's
      # single CPU never compresses bundles. -n leaves out the timestamp, so
      # unchanged files produce identical .gz files.
      - name: Precompress
        run: |
          find apps/web/dist -type f -size +1k \
            \( -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.json' \
               -o -name '*.svg' -o -name '*.webmanifest' \) \
            -exec gzip -9 -k -n {} +

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ env.TAG }}
          path: apps/web/dist/
          include-hidden-files: false
          retention-days: 30

  # Uploads the build as a new release folder on the droplet and switches the
  # "current" symlink to it. The only job with access to the server.
  deploy:
    name: Deploy to production
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
      SSH_USER: ${{ secrets.DEPLOY_USER }}
      PORT: ${{ vars.DEPLOY_PORT || '22' }}
      APP_DIR: ${{ vars.DEPLOY_PATH || '/var/www/predikt' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-${{ env.TAG }}
          path: dist

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $HOST
            User $SSH_USER
            Port $PORT
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
          EOF

      - name: Upload release
        run: |
          # Sorts by date: releases/20261104T153000Z-v0.5.0
          release_dir="releases/$(date -u +%Y%m%dT%H%M%SZ)-$TAG"
          echo "RELEASE_DIR=$release_dir" >> "$GITHUB_ENV"

          ssh server mkdir -p "$APP_DIR/releases"
          # --link-dest: files identical to the live release (most hashed
          # bundles) become hard links instead of new uploads and copies.
          # --checksum compares content, since every build has new timestamps.
          rsync --recursive --links --perms --checksum --compress --delete \
            --chmod=D755,F644 \
            --link-dest="$APP_DIR/current/" \
            dist/ "server:$APP_DIR/$release_dir/"

      - name: Switch to the new release
        id: activate
        run: |
          ssh server bash -s "$APP_DIR" "$RELEASE_DIR" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          new="$2"

          # previous -> the release that was live, so its bundles stay
          # reachable for phones that loaded the page just before this deploy.
          if [ -L current ]; then
            ln -sfn "$(readlink current)" previous.tmp
            mv -Tf previous.tmp previous
          fi

          # Point "current" at the new release. mv -T renames over the old
          # symlink in one step, so nginx never sees it missing.
          ln -sfn "$new" current.tmp
          mv -Tf current.tmp current
          echo "Live: $new"

          # Keep the 5 newest releases, plus whatever current/previous point at.
          live=$(readlink current)
          prev=$(readlink previous 2>/dev/null || true)
          ls -1d releases/*/ | sed 's#/$##' | sort -r | tail -n +6 | while read -r dir; do
            if [ "$dir" != "$live" ] && [ "$dir" != "$prev" ]; then
              rm -rf -- "$dir"
              echo "Removed old release $dir"
            fi
          done
          REMOTE

      - name: Check the live version
        if: vars.APP_URL != ''
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            live=$(curl -fsS "${APP_URL%/}/version.json" | jq -r '.release // empty' || true)
            if [ "$live" = "$TAG" ]; then
              echo "Live: $live"
              exit 0
            fi
            echo "Live is '$live', expected '$TAG'. Retrying..."
            sleep 5
          done
          echo "::error::${APP_URL%/}/version.json doesn't report $TAG"
          exit 1

      # If anything failed after the switch, put the previous release back.
      - name: Roll back
        if: failure() && steps.activate.outcome == 'success'
        run: |
          ssh server bash -s "$APP_DIR" <<'REMOTE'
          set -euo pipefail
          cd "$1"
          ln -sfn "$(readlink previous)" current.tmp
          mv -Tf current.tmp current
          echo "Rolled back to $(readlink current)"
          REMOTE

  release:
    name: GitHub Release
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with notes from merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Skip if you already created the release by hand in the GitHub UI.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          # 0.x versions are beta: mark them as pre-releases.
          prerelease=""
          if [[ "$TAG" == v0.* || "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" --verify-tag --generate-notes $prerelease
