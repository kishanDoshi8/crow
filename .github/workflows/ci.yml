name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets the release workflow run these same checks before deploying.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the CLI version pinned in package-lock.json, so CI and
      # `npm run db:*` locally always use the same one.
      - uses: supabase/setup-cli@v3
      # Applies every migration in supabase/migrations to a fresh local database.
      - run: supabase db start
      - run: supabase test db
