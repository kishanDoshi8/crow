name: CI

on:
  pull_request:
  push:
    branches: [master]
  # Lets the release workflow run these same checks before deploying.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the CLI version pinned in package-lock.json, so CI and
      # `npm run db:*` locally always use the same one.
      - uses: supabase/setup-cli@v3
      # Supabase's local ports (54320-54329, see supabase/config.toml) sit inside
      # Linux's ephemeral range (32768-60999), so an outgoing connection, e.g.
      # one of the image pulls, can hold 54322 just as Postgres tries to bind it
      # ("address already in use"). Reserve them so the kernel never hands them out.
      - name: Reserve Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      # Applies every migration in supabase/migrations to a fresh local database.
      - run: supabase db start
      - run: supabase test db
      # supabase/schemas must describe exactly what the migrations build, and
      # apply cleanly in config.toml's order, or `supabase db diff` misleads.
      - name: Schema files match migrations
        run: supabase/scripts/check-schema-drift.sh postgres
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
