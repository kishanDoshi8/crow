<!doctype html>
<!-- Source for public/og-image.jpg, the link-preview image. Regenerate: node og/render.mjs -->
<!-- Same look as the app and its share cards (src/features/share). -->
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Fira Code";
    src: url("../../../node_modules/@fontsource-variable/fira-code/files/fira-code-latin-wght-normal.woff2") format("woff2");
    font-weight: 300 700;
  }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 72px;
    background: #09090b; color: #fafafa; font-family: "Fira Code", ui-monospace, monospace;
    display: flex; align-items: center; gap: 56px;
  }
  .copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 28px; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 36px; font-weight: 700; }
  .tile { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, #ff2056, #fe9a00); overflow: hidden; }
  .tile svg { display: block; }
  h1 { margin: 0; font-size: 64px; font-weight: 700; line-height: 1.08; letter-spacing: -2px; }
  .rule { font-size: 26px; color: #a1a1aa; line-height: 1.5; }
  .card { width: 400px; flex-shrink: 0; border-radius: 32px; border: 2px solid rgba(255, 32, 86, 0.35); background: linear-gradient(160deg, rgba(255, 32, 86, 0.14), #18181b 55%); padding: 36px; display: flex; flex-direction: column; gap: 22px; box-sizing: border-box; }
  .pill { align-self: flex-start; font-size: 20px; font-weight: 600; color: #fb7185; background: rgba(255, 32, 86, 0.18); border-radius: 999px; padding: 6px 16px; }
  .q { font-size: 32px; font-weight: 700; line-height: 1.2; }
  .opt { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; justify-content: space-between; font-size: 22px; }
  .row span:last-child { color: #a1a1aa; }
  .track { height: 10px; border-radius: 999px; background: #27272a; }
  .fill { height: 10px; border-radius: 999px; background: linear-gradient(90deg, #ff2056, #fe9a00); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <div class="tile">
        <!-- The Crow mark (brand/crow.svg): ink crow on the tile, rose wing, white eye. -->
        <svg width="72" height="72" viewBox="0 0 512 512" aria-hidden="true"><path fill-rule="evenodd" fill="#020617" d="M-40 344 L140 192 L95 198 Q160 140 220 122 Q300 128 356 172 L362 180 Q440 190 488 240 Q420 236 372 252 Q334 268 332 300 C330 330 352 360 354 410 Q356 470 322 540 L-40 540 Z M60 322 C122 284 206 292 236 350 C256 392 246 436 224 474 C232 424 228 380 206 354 C172 316 112 308 60 322 Z M262 180 L318 203 C312 220 296 226 284 222 C268 216 262 198 262 180 Z"/><path fill="#ff2056" d="M60 322 C122 284 206 292 236 350 C256 392 246 436 224 474 C232 424 228 380 206 354 C172 316 112 308 60 322 Z"/><path fill="#fff" d="M262 180 L318 203 C312 220 296 226 284 222 C268 216 262 198 262 180 Z"/><circle cx="300" cy="200" r="8" fill="#020617"/></svg>
      </div>
      <span style="letter-spacing: -0.05em">crow</span>
    </div>
    <h1>Call it.<br>Crow about it.</h1>
    <div class="rule">Prediction series for friends. Same points for everyone, top balance takes the title.</div>
  </div>
  <div class="card">
    <span class="pill">● Live</span>
    <span class="q">Who wins the final?</span>
    <div class="opt"><div class="row"><span>France</span><span>58%</span></div><div class="track"><div class="fill" style="width: 58%"></div></div></div>
    <div class="opt"><div class="row"><span>Brazil</span><span>42%</span></div><div class="track"><div class="fill" style="width: 42%"></div></div></div>
  </div>
</body>
</html>
